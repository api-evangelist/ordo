  /account/information/institutions:
    get:
      tags:
      - Account Data - Client Hosted
      summary: Gets a list of AIS enabled institutions
      description: Gets a list of AIS enabled institutions
      operationId: get-account-information-institutions
      parameters:
      - name: OrdoInstitutionId
        in: query
        schema:
          maxLength: 50
          minLength: 0
          type: string
      - name: Permissions
        in: query
        schema:
          type: array
          items:
            type: string
      - name: participantId
        in: header
        description: Format - int32. Participant ID in the header
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
              examples:
                default:
                  value: null
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
              example:
                ordoInstitutionId: string
                name: string
                media:
                  iconUrl: string
                  logoUrl: string
                refundDataAvailable: true
                aisEnabled: true
                features:
                - string
            text/json:
              schema:
                $ref: '#/components/schemas/InstitutionResponse'
              example:
