name: Ordo
kind: company
description: >-
  Ordo (operated by The Smart Request Company Ltd, ordohq.com / ordopay.com) is
  a United Kingdom open-banking payments provider that lets businesses collect
  money directly from a customer's bank account over the UK Faster Payments
  rails, avoiding card fees and chargebacks. Built on PSD2 / Open Banking payment
  initiation, its fully hosted, white-labelled platform delivers Request to Pay,
  one-off payment requests, e-commerce, Point of Sale / QR code and contact
  centre payments, plus Variable Recurring Payments (VRP) for fixed, variable and
  sweeping collections, and account information (AIS) and account verification
  services. Ordo is FCA-authorised and an Open Banking regulated provider, with a
  developer surface historically published as a ReadMe.io portal at
  docs.myordo.com backed by an Azure API Management gateway (test.api.ordopay.com).
  Ordo has since ceased trading and been acquired by Neonomics; the marketing site
  at ordopay.com remains live while the developer portal is now offline. Its API
  posture is documented here honestly from six OpenAPI 3.0.1 definitions harvested
  verbatim from the archived developer portal.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
